<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - AI Shift Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1923; color: #e0e0e0; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-card { background: #152033; border-radius: 12px; padding: 2rem; width: 100%; max-width: 380px; }
        h1 { font-size: 1.3rem; color: #4a9eff; margin-bottom: 0.5rem; }
        .subtitle { font-size: 0.85rem; color: #666; margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.85rem; color: #8899aa; margin-bottom: 0.5rem; }
        input { width: 100%; padding: 0.7rem 0.8rem; border: 1px solid #2a3a4a; border-radius: 6px; background: #0d1520; color: #e0e0e0; font-size: 0.95rem; margin-bottom: 1rem; }
        input:focus { outline: none; border-color: #4a9eff; box-shadow: 0 0 0 3px rgba(74,158,255,0.1); }
        .btn { width: 100%; padding: 0.7rem; background: #4a9eff; color: #fff; border: none; border-radius: 6px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
        .btn:hover { background: #3a8ee0; }
        .error { color: #ff6a6a; font-size: 0.85rem; margin-bottom: 1rem; }
        .success { color: #8bc34a; font-size: 0.85rem; margin-bottom: 1rem; }
        .back-link { display: block; text-align: center; margin-top: 1rem; color: #4a9eff; text-decoration: none; font-size: 0.85rem; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Reset Password</h1>
        <p class="subtitle">Enter your username and a new password.</p>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        {% if success %}<p class="success">{{ success }}</p>{% endif %}
        <form method="POST">
            <label>Username</label>
            <input type="text" name="username" placeholder="Enter your username" required>
            <label>New Password</label>
            <input type="password" name="new_password" placeholder="Enter new password" required>
            <label>Confirm Password</label>
            <input type="password" name="confirm_password" placeholder="Confirm new password" required>
            <button type="submit" class="btn">Reset Password</button>
        </form>
        <a href="/login" class="back-link">Back to Login</a>
    </div>
</body>
</html>
