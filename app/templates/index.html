<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Shift Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1923;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
        }
        .header {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            padding: 1rem 2rem;
        }
        .logout-btn {
            color: #4a9eff;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .logout-btn:hover {
            text-decoration: underline;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #4a9eff;
        }
        .tagline {
            font-size: 1.25rem;
            color: #a0a0a0;
            margin-bottom: 1rem;
        }
        .welcome {
            font-size: 1rem;
            color: #8899aa;
            margin-bottom: 2rem;
        }
        .coming-soon {
            font-size: 1.5rem;
            color: #666;
            letter-spacing: 2px;
        }
        .footer {
            margin-top: 4rem;
            font-size: 0.85rem;
            color: #444;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="/logout" class="logout-btn">Sign Out</a>
    </div>
    <div class="container">
        <h1>AI Shift Manager</h1>
        {% if user %}
        <p class="welcome">Welcome, {{ user.display_name }}</p>
        {% endif %}
        <p class="tagline">An AI-powered shift scheduling app for supervisors in 24/7 security operations.</p>
        <p class="coming-soon">Coming Soon</p>
        <p class="footer">CUA Busch School AI Vibe Coding Contest, Fall 2026</p>
    </div>
</body>
</html>
