<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Shift Manager - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1923;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-box {
            background: #1a2634;
            padding: 2.5rem;
            border-radius: 8px;
            width: 360px;
            max-width: 90vw;
        }
        .login-box h1 {
            font-size: 1.5rem;
            color: #4a9eff;
            text-align: center;
            margin-bottom: 0.25rem;
        }
        .login-box .subtitle {
            text-align: center;
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #8899aa;
            margin-bottom: 0.4rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.7rem 0.8rem;
            border: 1px solid #2a3a4a;
            border-radius: 4px;
            background: #0d1520;
            color: #e0e0e0;
            font-size: 0.95rem;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4a9eff;
        }
        .error {
            color: #ff4a4a;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 1rem;
        }
        .btn {
            width: 100%;
            padding: 0.75rem;
            background: #4a9eff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }
        .btn:hover {
            background: #3a8ee0;
        }
        .footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #444;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>AI Shift Manager</h1>
        <p class="subtitle">Sign in to manage your shifts</p>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
        <form method="POST" action="/login">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>
        <p class="footer">CUA Busch School AI Vibe Coding Contest, Fall 2026</p>
    </div>
</body>
</html>
