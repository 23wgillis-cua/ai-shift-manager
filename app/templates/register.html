<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Shift Manager - Register</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1923;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            line-height: 1.5;
        }
        .login-box {
            background: #152033;
            padding: 2.5rem;
            border-radius: 12px;
            width: 380px;
            max-width: 90vw;
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
        }
        .login-box h1 {
            font-size: 1.5rem;
            color: #4a9eff;
            text-align: center;
            margin-bottom: 0.25rem;
            font-weight: 700;
        }
        .login-box .subtitle {
            text-align: center;
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 2rem;
        }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #8899aa;
            margin-bottom: 0.4rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.7rem 0.8rem;
            border: 1px solid #2a3a4a;
            border-radius: 6px;
            background: #0d1520;
            color: #e0e0e0;
            font-size: 0.95rem;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4a9eff;
            box-shadow: 0 0 0 3px rgba(74,158,255,0.1);
        }
        .error {
            color: #ff4a4a;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 1rem;
        }
        .btn {
            width: 100%;
            padding: 0.75rem;
            background: #4a9eff;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn:hover { background: #3a8ee0; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .alt-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #666;
        }
        .alt-link a { color: #4a9eff; text-decoration: none; }
        .alt-link a:hover { text-decoration: underline; }
        .footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #444;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>AI Shift Manager</h1>
        <p class="subtitle">Create a new account</p>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
        <form method="POST" action="/register">
            <div class="form-group">
                <label for="display_name">Display Name</label>
                <input type="text" id="display_name" name="display_name" placeholder="Your name" required autofocus>
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="At least 4 characters" required>
            </div>
            <div class="form-group">
                <label for="email">Email (optional)</label>
                <input type="email" id="email" name="email" placeholder="you@example.com">
            </div>
            <button type="submit" class="btn">Create Account</button>
        </form>
        <p class="alt-link">Already have an account? <a href="/login">Sign in</a></p>
        <p class="footer">CUA Busch School AI Vibe Coding Contest, Fall 2026</p>
    </div>
</body>
</html>
