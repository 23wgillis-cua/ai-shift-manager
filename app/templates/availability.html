<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Shift Manager - Availability</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1923;
            color: #e0e0e0;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            border-bottom: 1px solid #1a2634;
        }
        .header .brand {
            font-size: 1.1rem;
            color: #4a9eff;
            font-weight: 600;
        }
        .header a {
            color: #4a9eff;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .header a:hover { text-decoration: underline; }
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 2rem;
        }
        h1 {
            font-size: 1.5rem;
            color: #4a9eff;
            margin-bottom: 0.25rem;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 1.5rem;
        }
        .emp-row {
            background: #1a2634;
            padding: 1rem 1.25rem;
            border-radius: 6px;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .emp-name {
            font-size: 0.95rem;
            color: #c8d0d8;
            min-width: 120px;
        }
        .emp-role {
            font-size: 0.75rem;
            color: #555;
        }
        .emp-row label {
            font-size: 0.8rem;
            color: #8899aa;
        }
        .emp-row input {
            padding: 0.5rem;
            border: 1px solid #2a3a4a;
            border-radius: 4px;
            background: #0d1520;
            color: #e0e0e0;
            font-size: 0.85rem;
            width: 220px;
        }
        .emp-row input:focus {
            outline: none;
            border-color: #4a9eff;
        }
        .btn {
            padding: 0.6rem 1.5rem;
            background: #4a9eff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 1rem;
        }
        .btn:hover { background: #3a8ee0; }
        .footer {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.75rem;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="header">
        <span class="brand">AI Shift Manager</span>
        <div style="display: flex; gap: 1rem;">
            <a href="/">Notes</a>
            <a href="/logout">Sign Out</a>
        </div>
    </div>
    <div class="container">
        <h1>Employee Availability</h1>
        <p class="subtitle">Set days each employee is unavailable. The swap dropdown filters these out automatically.</p>
        <form method="POST" action="/availability">
            {% for emp in employees %}
            <div class="emp-row">
                <div>
                    <span class="emp-name">{{ emp.name }}</span>
                    <span class="emp-role">({{ emp.role }})</span>
                </div>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <label>Unavailable days:</label>
                    <input type="text" name="days_{{ emp.id }}" value="{{ emp.unavailable_days or '' }}" placeholder="e.g. monday, friday">
                </div>
            </div>
            {% endfor %}
            <button type="submit" class="btn">Save Availability</button>
        </form>
        <p class="footer">CUA Busch School AI Vibe Coding Contest, Fall 2026</p>
    </div>
</body>
</html>
